---
# yamllint disable-line rule:line-length
# yaml-language-server: $schema=https://raw.githubusercontent.com/DavidAnson/markdownlint/main/schema/markdownlint-config-schema.json
default: true
no-hard-tabs:
  code_blocks: true
  ignore_code_languages: []
  spaces_per_tab: 2
line-length:
  line_length: 120
  heading_line_length: 80
  # Exclude the following elements from maximum line-length checks
  code_blocks: false
  tables: false
  strict: false
  stern: false
commands-show-output: false
no-inline-html:
  allowed_elements:
    - br
no-bare-urls: false
no-duplicate-heading:
  siblings_only: true
table-column-style:
  style: compact
